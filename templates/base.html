<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}dnex{% endblock %}</title>
    <link rel="alternate" type="application/atom+xml" title="nex's devlog" href="/atom.xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    {% block head %}{% endblock %}
</head>
<body>
    <header class="site-header">
        <a class="brand" href="/">dnex</a>
        <nav class="site-nav" aria-label="Primary">
            <a href="/blog/">Blog</a>
            <a href="https://github.com/dnexdev" target="_blank" rel="noopener noreferrer">GitHub</a>
            <a href="mailto:me@dnex.dev">Email</a>
        </nav>
    </header>

    <main class="{% block main_class %}{% endblock %}">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <a href="mailto:me@dnex.dev">me@dnex.dev</a>
        <a href="https://github.com/dnexdev" rel="noopener noreferrer" target="_blank">github</a>
        <a href="/atom.xml" class="rss-link" title="RSS/Atom feed" aria-label="RSS feed">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M4 11a9 9 0 0 1 9 9"></path>
                <path d="M4 4a16 16 0 0 1 16 16"></path>
                <circle cx="5" cy="19" r="1"></circle>
            </svg>
        </a>
    </footer>
    {% block scripts %}{% endblock %}
</body>
</html>
